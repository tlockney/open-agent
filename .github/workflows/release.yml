name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Shellcheck
        run: shellcheck ./*.sh

      - name: Check formatting
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

      # The release tarball is built from the tag, but the daemon and CLI
      # report the version from src/lib/version.ts. If they disagree, the
      # shipped binary lies about its version — fail the tag before it ships.
      - name: Verify version matches tag
        run: |
          VERSION=$(sed -n 's/export const VERSION = "\(.*\)";/\1/p' src/lib/version.ts)
          if [ -z "$VERSION" ]; then
            echo "could not read VERSION from src/lib/version.ts" >&2
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "version.ts says ${VERSION} but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version ${VERSION} matches tag ${GITHUB_REF_NAME}"

  # The daemon is the artifact being published, so exercise it for real
  # before a tag ships.
  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Run integration tests
        run: deno task test:integration

  release:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREFIX="open-agent-${VERSION}"
          tar czf "${PREFIX}.tar.gz" \
            --transform "s,^,${PREFIX}/," \
            src/ \
            deno.json \
            oa-wrapper.sh \
            com.open-agent.daemon.plist \
            install.sh \
            open-agent-hook.sh \
            ssh_config.example

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: open-agent-*.tar.gz
          generate_release_notes: true
